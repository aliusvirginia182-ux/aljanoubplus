<script>
const SUPABASE_URL="https://gvppxzokwqwjnkifrugm.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_OGG3jg1JT-IDIPgUxgFaJA_XMTWzADd";
if(/^\/n\/[^/]+/.test(location.pathname)&&!location.hash){location.replace("/#/n/"+location.pathname.split("/")[2])}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const ext=t=>({"image/png":"png","image/webp":"webp","image/gif":"gif"}[t]||"jpg");
async function upFile(b,type){const path=Date.now().toString(36)+Math.random().toString(36).slice(2,8)+"."+ext(type);const {error}=await sb.storage.from("news-images").upload(path,b,{contentType:type,cacheControl:"31536000"});if(error)throw error;return sb.storage.from("news-images").getPublicUrl(path).data.publicUrl}
function dataBlob(d){const m=/^data:([^;]+);base64,(.*)$/.exec(d),bin=atob(m[2]),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:m[1]})}

  const [catsRes,newsRes,settingsRes,sessionRes]=await Promise.all([

  cloudUser=sessionRes.data.session?.user||null; cloudRole=null;

async function cloudSaveNews(n){
 const payload={id:n.id,title:n.title,summary:n.summary,body:n.body,category:n.cat,author:n.author,image_url:n.img||null,video_url:n.video||null,status:n.status==="hidden"||n.trash?"archived":n.status,is_breaking:!!n.breaking,is_featured:!!n.featured,is_pinned:!!n.pinned,published_at:n.date,updated_at:new Date().toISOString()};
 if(!DB.news.some(x=>x.id===n.id&&x.by))payload.created_by=cloudUser?.id;

}
async function cloudSaveSettings(){const {error}=await sb.from("site_settings").upsert({key:"site",value:DB.settings});if(error)throw error;}
async function cloudSaveCategories(){
 // The categories.id column is database-generated (GENERATED ALWAYS AS IDENTITY).
 // Never send an id value in INSERT. Update existing rows by their current ordered position,
 // insert new rows without id, and delete rows removed from the end of the list.
 const current=await sb.from("categories").select("id,name,sort_order").order("sort_order",{ascending:true});
 if(current.error)throw current.error;
 const existing=current.data||[];
 const wanted=DB.cats.map(x=>String(x).trim()).filter(Boolean);
 if(new Set(wanted).size!==wanted.length)throw new Error("لا يمكن تكرار اسم القسم");
 const shared=Math.min(existing.length,wanted.length);
 for(let i=0;i<shared;i++){
   const {error}=await sb.from("categories").update({name:wanted[i],sort_order:i}).eq("id",existing[i].id);
   if(error)throw error;
 }
 for(let i=existing.length;i<wanted.length;i++){
   const {error}=await sb.from("categories").insert({name:wanted[i],sort_order:i});
   if(error)throw error;
 }
 if(existing.length>wanted.length){
   const ids=existing.slice(wanted.length).map(x=>x.id);
   const {error}=await sb.from("categories").delete().in("id",ids);
   if(error)throw error;
 }
}

<nav><a href="#/">الرئيسية</a>${DB.cats.map(c=>`<a href="#/c/${encodeURIComponent(c)}">${esc(c)}</a>`).join("")}<a href="#/top">الأكثر قراءة</a></nav>
<form class="sb" onsubmit="location.hash='#/s/'+encodeURIComponent(this.q.value);return false"><input name="q" placeholder="بحث..."><button>بحث</button></form></div></header>
${br.length?`<div class="bk"><div class="w"><b>عاجل</b><div style="overflow:hidden;flex:1"><span>${br.map(n=>`<a href="#/n/${n.id}">${esc(n.title)}</a>`).join("")}</span></div></div></div>`:""}
<main class="w">${inner}</main>

<div class="w meta" style="margin-top:12px;color:#9fb3af">© ${new Date().getFullYear()} ${esc(s.name)} — جميع الحقوق محفوظة</div></footer>`}

function home(){
const p=pub(),feat=p.filter(n=>n.featured),main=feat[0]||p[0],side=(feat.length>1?feat:p).filter(n=>n!==main).slice(0,3);
if(!p.length)return shell(`<div class="art" style="text-align:center"><h2>لا توجد أخبار منشورة بعد</h2><p class="meta">ادخل إلى لوحة التحكم عبر <a href="#/admin" style="color:var(--r)">/admin</a> لإضافة أول خبر.</p></div>`);
const pinned=p.filter(n=>n.pinned&&n!==main);

let h=`<div class="hero"><a class="big" href="#/n/${main.id}"><span class="bigimg" ${bg(main)}></span><div><span class="tag">${esc(main.cat)}</span><h2>${esc(main.title)}</h2><p>${esc(main.summary)}</p></div></a><div class="side">${side.map(mini).join("")}</div></div>`;
h+=`<div class="sec"><h2>آخر الأخبار</h2><div class="cards">${rest.map(card).join("")}</div></div>${adBox()}`;
DB.cats.forEach(c=>{const l=p.filter(n=>n.cat===c).slice(0,4);if(l.length)h+=`<div class="sec"><h2><a href="#/c/${encodeURIComponent(c)}">${esc(c)}</a></h2><div class="cards">${l.map(card).join("")}</div></div>`});

function article(id){
const n=DB.news.find(x=>x.id===id);
if(!n||n.trash||(n.status!=="published"&&!isAdm()))return shell(`<div class="art"><h2>الخبر غير موجود</h2></div>`);
if(n.status==="published"&&!sessionStorage.getItem("v"+id)){n.views++;sessionStorage.setItem("v"+id,1);sb.rpc("increment_views",{news_id:id}).then(r=>{if(r.error)console.warn("views:",r.error.message)})}
if(n.bl===undefined&&!n.body){n.bl=1;sb.from("news").select("body").eq("id",id).maybeSingle().then(r=>{n.body=(r.data&&r.data.body)||"";n.bl=2;if(location.hash==="#/n/"+id)render()})}

const SU=location.origin+"/n/"+encodeURIComponent(n.id),u=encodeURIComponent(SU),t=encodeURIComponent(n.title);
const all=pub(),idx=all.findIndex(x=>x.id===n.id),newer=idx>0?all[idx-1]:null,older=idx>=0?all[idx+1]:null;
const rel=all.filter(x=>x.cat===n.cat&&x.id!==n.id).slice(0,3);
const vid=n.video?(/youtu/.test(n.video)?`<iframe style="width:100%;aspect-ratio:16/9;border:0;border-radius:12px" src="https://www.youtube.com/embed/${esc((n.video.match(/(?:v=|be\/)([\w-]{11})/)||[])[1]||"")}" allowfullscreen loading="lazy"></iframe>`:`<video controls style="width:100%;border-radius:12px" src="${safeLink(n.video)}"></video>`):"";
return shell(`<article class="art pg"><header class="article-head"><span class="tag">${esc(n.cat)}</span>${n.status!=="published"?" <b>(معاينة)</b>":""}<h1>${esc(n.title)}</h1><div class="article-meta"><span>✍ ${esc(n.author)}</span><span>◷ ${fd(n.date)}</span><span>👁 ${n.views} مشاهدة</span></div></header>
${n.img?`<img class="article-cover" src="${safeUrl(n.img)}" alt="${esc(n.title)}" loading="eager">`:""}<p class="article-summary">${esc(n.summary)}</p><div class="bd">${n.bl===1?'<p class="meta">جارٍ تحميل الخبر…</p>':clean(n.body)}</div>${vid}
<div class="article-tools"><a class="btn" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${u}">Facebook</a><a class="btn o" target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?url=${u}&text=${t}">X</a><a class="btn r" target="_blank" rel="noopener" href="https://wa.me/?text=${t}%20${u}">WhatsApp</a><button class="o" style="color:var(--t);background:none;border:1px solid var(--b)" onclick="navigator.clipboard.writeText('${SU}').then(()=>toast('تم نسخ الرابط'))">نسخ الرابط</button></div></article>
${newer||older?`<nav class="article-pager" aria-label="التنقل بين الأخبار">${older?`<a href="#/n/${older.id}"><small>← الخبر السابق</small><strong>${esc(older.title)}</strong></a>`:`<span></span>`}${newer?`<a href="#/n/${newer.id}" style="text-align:left"><small>الخبر الأحدث ←</small><strong>${esc(newer.title)}</strong></a>`:""}</nav>`:""}
${adBox()}${rel.length?`<div class="sec"><h2>أخبار ذات صلة</h2><div class="cards">${rel.map(card).join("")}</div></div>`:""}`)}

 const pr=await sb.from("profiles").select("role").eq("id",cloudUser.id).maybeSingle();
 if(pr.error||!pr.data){await sb.auth.signOut();cloudUser=null;return render(login("لم يتم العثور على صلاحيات هذا الحساب"));}

const q=($("#q")||{}).value||"",c=($("#fc")||{}).value||"",s=($("#fs")||{}).value||"";
const l=DB.news.filter(n=>mine(n)&&(s==="trash"?n.trash:!n.trash)&&(!q||n.title.includes(q))&&(!c||n.cat===c)&&(!s||s==="trash"||n.status===s)).sort((a,b)=>new Date(b.date)-new Date(a.date));
return `<div style="display:flex;gap:6px;flex-wrap:wrap"><input id="q" placeholder="بحث" value="${esc(q)}" oninput="render()"><select id="fc" onchange="render()"><option value="">كل الأقسام</option>${DB.cats.map(x=>`<option ${x===c?"selected":""}>${esc(x)}</option>`).join("")}</select><select id="fs" onchange="render()"><option value="">كل الحالات</option><option value="published" ${s==="published"?"selected":""}>منشور</option><option value="draft" ${s==="draft"?"selected":""}>مسودة</option><option value="hidden" ${s==="hidden"?"selected":""}>مخفي</option><option value="trash" ${s==="trash"?"selected":""}>المحذوفات</option></select></div>
<div class="tw"><table><tr><th>العنوان</th><th>القسم</th><th>الحالة</th><th>👁</th><th></th></tr>${l.map(n=>`<tr><td><a href="#/n/${n.id}">${esc(n.title)}</a>${n.breaking?' <span class="tag">عاجل</span>':""}${n.pinned?" 📌":""}</td><td>${esc(n.cat)}</td><td>${{published:"منشور",draft:"مسودة",hidden:"مخفي"}[n.status]}</td><td>${n.views}</td><td style="white-space:nowrap">${n.trash?`<button onclick="act('${n.id}','restore')">استعادة</button>`:`<button onclick="editId='${n.id}';tab='new';render()">تعديل</button> <button class="o" style="color:var(--t);background:none;border:1px solid var(--b)" onclick="act('${n.id}','hide')">${n.status==="hidden"?"إظهار":"إخفاء"}</button> <button onclick="act('${n.id}','pin')" class="o" style="color:var(--t);background:none;border:1px solid var(--b)">تثبيت</button> <button class="r" onclick="act('${n.id}','del')">حذف</button>`}</td></tr>`).join("")}</table></div>`}
if(tab==="cats")return `<div class="f"><div style="display:flex;gap:6px"><input id="nc" placeholder="قسم جديد"><button onclick="addCat()">إضافة</button></div></div><table>${DB.cats.map((c,i)=>`<tr><td>${esc(c)}</td><td style="white-space:nowrap"><button onclick="mvCat(${i},-1)">▲</button> <button onclick="mvCat(${i},1)">▼</button> <button onclick="renCat(${i})">تعديل</button> <button class="r" onclick="delCat(${i})">حذف</button></td></tr>`).join("")}</table>`;
if(tab==="users")return `<div class="f"><label>اسم المستخدم</label><input id="uu"><label>كلمة المرور</label><input id="up" type="password"><label>الدور</label><select id="ur"><option value="editor">محرر</option><option value="writer">كاتب</option></select><br><br><button onclick="addUser()">إنشاء حساب</button></div><table>${DB.users.map((u,i)=>`<tr><td>${esc(u.u)}</td><td>${u.role==="editor"?"محرر":"كاتب"}</td><td><button class="r" onclick="DB.users.splice(${i},1);save();render()">حذف</button></td></tr>`).join("")}</table>`;
if(tab==="set"){const s=DB.settings,sc=s.social||{};return `<div class="f"><h2>إعدادات الهوية والمظهر</h2><div class="brand-preview"><img src="${esc(s.logo||'assets/jnplus-logo.png')}" alt="معاينة الشعار"><span class="brand-note">معاينة الشعار الحالي. يفضّل استخدام صورة PNG شفافة وعالية الدقة.</span></div><label>اسم الموقع</label><input id="s1" value="${esc(s.name)}"><h3 style="margin-top:18px">ألوان الهوية البصرية</h3><div class="color-grid"><div><label>اللون الأساسي</label><input id="brandPrimary" type="color" value="${esc(s.primary||"#123a32")}"></div><div><label>اللون الثانوي</label><input id="brandSecondary" type="color" value="${esc(s.secondary||"#24584d")}"></div><div><label>لون التمييز والعاجل</label><input id="brandAccent" type="color" value="${esc(s.accent||"#c51d24")}"></div></div><p class="meta">تُطبّق الألوان على الشريط العلوي والقوائم والأزرار والعناوين العاجلة.</p><label>شعار الموقع (PNG أو JPG)</label><input type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadLogo(this)"><button type="button" class="o" style="color:var(--t);background:none;border:1px solid var(--b);margin-top:6px" onclick="DB.settings.logo='assets/jnplus-logo.png';render();toast('تمت استعادة الشعار الافتراضي؛ اضغط حفظ الإعدادات')">استعادة الشعار الأصلي</button><h3 style="margin-top:18px">روابط وأيقونات التواصل الاجتماعي</h3><label>Facebook</label><input id="s2" value="${esc(sc.fb||s.fb||'')}" placeholder="https://facebook.com/..."><label>X</label><input id="s3" value="${esc(sc.x||s.x||'')}" placeholder="https://x.com/..."><label>TikTok</label><input id="stiktok" value="${esc(sc.tiktok||'')}" placeholder="https://tiktok.com/@..."><label>Instagram</label><input id="sinstagram" value="${esc(sc.instagram||'')}" placeholder="https://instagram.com/..."><label>Telegram</label><input id="stelegram" value="${esc(sc.telegram||'')}" placeholder="https://t.me/..."><label>WhatsApp</label><input id="swhatsapp" value="${esc(sc.whatsapp||'')}" placeholder="https://wa.me/..."><h3 style="margin-top:18px">معلومات الموقع</h3><label>نبذة عن الموقع</label><textarea id="s4">${esc(s.about)}</textarea><label>بيانات الاتصال</label><input id="s5" value="${esc(s.contact)}"><label>سياسة الخصوصية</label><textarea id="s6">${esc(s.privacy||"")}</textarea><label>شروط الاستخدام</label><textarea id="s7">${esc(s.terms||"")}</textarea><label>عدد الأخبار في الرئيسية</label><input id="s8" type="number" value="${s.perPage}"><h3 style="margin-top:18px">الإعلانات</h3><label>صورة الإعلان</label><input type="file" accept="image/*" onchange="img(this,800,v=>{DB.settings.ad=v;toast('تم تحميل صورة الإعلان؛ احفظ الإعدادات')})"><label>رابط الإعلان</label><input id="s9" value="${esc(s.adLink)}"><br><br><button onclick="saveSet()">حفظ إعدادات الهوية والموقع</button> <button class="o" style="color:var(--t);background:none;border:1px solid var(--b)" onclick="DB.settings.ad='';saveSet()">إيقاف الإعلان</button><h3 style="margin-top:20px">تغيير كلمة المرور</h3><input id="pw" type="password" placeholder="كلمة المرور الجديدة (8 أحرف+)"><br><br><button class="r" onclick="chPw()">تغيير</button><h3 style="margin-top:20px">النسخ الاحتياطي</h3><button onclick="exportDB()">تصدير</button> <input type="file" accept=".json" onchange="importDB(this)" style="width:auto"></div>`}}
function editor(){
const n=DB.news.find(x=>x.id===editId)||{title:"",summary:"",body:"",cat:DB.cats[0],author:sessionStorage.getItem("jn_user")||"التحرير",img:"",video:"",status:"draft",date:new Date().toISOString(),keys:""};
return `<div class="f"><h3>${editId?"تعديل خبر":"إضافة خبر جديد"}</h3><label>العنوان</label><input id="e1" value="${esc(n.title)}"><label>وصف مختصر</label><textarea id="e2" rows="2">${esc(n.summary)}</textarea>
<label>القسم</label><select id="e3">${DB.cats.map(c=>`<option ${c===n.cat?"selected":""}>${esc(c)}</option>`).join("")}</select><label>الكاتب</label><input id="e4" value="${esc(n.author)}"><label>الكلمات المفتاحية</label><input id="e5" value="${esc(n.keys||"")}">
<label>الصورة الرئيسية</label><input type="file" accept="image/*" onchange="img(this,1000,v=>{window.cov=v;toast('تم رفع الصورة')})"><label>رابط فيديو (يوتيوب أو ملف)</label><input id="e6" value="${esc(n.video||"")}">
<label>المحتوى</label><div class="tb"><button onclick="document.execCommand('bold')"><b>B</b></button><button onclick="document.execCommand('formatBlock',0,'h2')">عنوان فرعي</button><button onclick="document.execCommand('formatBlock',0,'p')">فقرة</button><button onclick="document.execCommand('insertUnorderedList')">قائمة</button><button onclick="let u=prompt('الرابط');u&&document.execCommand('createLink',0,u)">رابط</button><label style="margin:0;background:var(--g2);color:#fff;padding:4px 10px;border-radius:6px;cursor:pointer">صورة<input type="file" accept="image/*" hidden onchange="img(this,900,v=>document.execCommand('insertImage',0,v))"></label></div><div id="ed" contenteditable="true">${clean(n.body)}</div>
<div class="ck"><label><input type="checkbox" id="c1" ${n.breaking?"checked":""}>عاجل</label><label><input type="checkbox" id="c2" ${n.featured?"checked":""}>رئيسي</label><label><input type="checkbox" id="c3" ${n.pinned?"checked":""}>تثبيت</label></div>
<label>تاريخ النشر / الجدولة</label><input id="e7" type="datetime-local" value="${new Date(new Date(n.date)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16)}">
<br><button onclick="saveNews('published')">نشر</button> <button class="o" style="color:var(--t);background:none;border:1px solid var(--b)" onclick="saveNews('draft')">حفظ كمسودة</button> ${editId?`<a class="btn r" href="#/n/${editId}">معاينة</a>`:""}</div>`}
window.cov=null;
function uploadLogo(inp){const f=inp.files&&inp.files[0];if(!f)return;if(!/^image\/(png|jpeg|webp)$/.test(f.type))return toast("اختر صورة PNG أو JPG أو WebP");if(f.size>2*1024*1024)return toast("حجم الشعار يجب ألا يتجاوز 2 ميجابايت");upFile(f,f.type).then(u=>{DB.settings.logo=u;render();toast("تم رفع الشعار؛ اضغط حفظ إعدادات الهوية")}).catch(e=>toast("تعذر رفع الشعار: "+(e.message||e)))}
function img(inp,max,cb){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/i.width),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);upImg(c.toDataURL("image/jpeg",.78)).then(cb).catch(e=>toast("تعذر رفع الصورة: "+(e.message||e)))};i.src=r.result};r.readAsDataURL(f)}
async function saveNews(st){
const t=$("#e1").value.trim();if(!t)return toast("العنوان مطلوب");
const old=DB.news.find(x=>x.id===editId),w=role()==="writer";
if(w&&st==="published")st="draft";
const n={id:old?old.id:"n"+Date.now().toString(36),title:t,summary:$("#e2").value,cat:$("#e3").value,author:$("#e4").value,keys:$("#e5").value,video:$("#e6").value,body:clean($("#ed").innerHTML),img:window.cov||(old?old.img:""),breaking:$("#c1").checked,featured:$("#c2").checked,pinned:$("#c3").checked,date:new Date($("#e7").value||Date.now()).toISOString(),status:st,views:old?old.views:0,by:old?old.by:cloudUser.id};
try{await cloudSaveNews(n);if(old)Object.assign(old,n);else DB.news.push(n);log((old?"تعديل: ":"إضافة: ")+t);save();window.cov=null;toast(w&&st==="draft"?"حُفظ كمسودة بانتظار المراجعة":"تم الحفظ في قاعدة البيانات");editId=null;tab="list";render();}
catch(e){toast("تعذر حفظ الخبر: "+(e.message||"تحقق من الاتصال والصلاحيات"));}}
async function act(id,a){const n=DB.news.find(x=>x.id===id);if(!n)return;
if(a==="del"&&confirm("حذف الخبر؟"))n.trash=true;
if(a==="restore")n.trash=false;
if(a==="hide")n.status=n.status==="hidden"?"published":"hidden";
if(a==="pin")n.pinned=!n.pinned;
try{if(a==="del")await sb.from("news").delete().eq("id",id).throwOnError();else await cloudSaveNews(n);log(a+": "+n.title);save();render();}
catch(e){toast("تعذر تحديث الخبر: "+(e.message||"خطأ"));}}
async function addCat(){const v=$("#nc").value.trim();if(v&&!DB.cats.includes(v)){DB.cats.push(v);try{await cloudSaveCategories();save();render()}catch(e){DB.cats.pop();toast("تعذر حفظ القسم: "+e.message)}}}
async function delCat(i){
 const old=DB.cats[i]; if(!old)return;
 if(DB.cats.length<2)return toast("لا يمكن حذف القسم الأخير؛ أضف قسماً بديلاً أولاً");
 const choices=DB.cats.filter((_,k)=>k!==i);
 const target=prompt("الأخبار الموجودة في هذا القسم ستُنقل إلى أي قسم؟\n\n"+choices.map((x,k)=>(k+1)+". "+x).join("\n"),choices[0]);
 if(target===null)return;
 const dest=target.trim(); if(!choices.includes(dest))return toast("اختر اسماً صحيحاً من الأقسام المتاحة");
 if(!confirm("سيتم نقل أخبار «"+old+"» إلى «"+dest+"» ثم حذف القسم. هل تريد المتابعة؟"))return;
 const affected=DB.news.filter(n=>n.cat===old); const oldCats=[...DB.cats]; let cloudMoved=false, cloudDeleted=false;
 try{
   if(cloudReady){const {error}=await sb.from("news").update({category:dest}).eq("category",old);if(error)throw error; cloudMoved=true;
     const {error:delError}=await sb.from("categories").delete().eq("name",old);if(delError)throw delError; cloudDeleted=true;}
   affected.forEach(n=>n.cat=dest); DB.cats.splice(i,1); save();
   if(cloudReady){const fresh=await sb.from("categories").select("name").order("sort_order",{ascending:true});if(fresh.error)throw fresh.error;DB.cats=(fresh.data||[]).map(x=>x.name);}
   toast("تم نقل الأخبار وحذف القسم بنجاح");render();
 }catch(e){
   if(cloudMoved&&!cloudDeleted){try{await sb.from("news").update({category:old}).eq("category",dest);}catch(_){}}
   DB.cats=oldCats; affected.forEach(n=>n.cat=old); save();
   toast("تعذر حذف القسم: "+(e.message||"تحقق من صلاحيات جدول الأخبار والأقسام"));
 }
}
async function renCat(i){
 const old=DB.cats[i]; if(!old)return;
 const v=prompt("اكتب الاسم الجديد للقسم",old); if(!v||!v.trim())return;
 const name=v.trim(); if(name===old)return; if(DB.cats.includes(name))return toast("هذا القسم موجود بالفعل");
 const affected=DB.news.filter(n=>n.cat===old); let inserted=false,moved=false;
 try{
   if(cloudReady){
     const {data:row,error:findError}=await sb.from("categories").select("id,sort_order").eq("name",old).maybeSingle(); if(findError)throw findError; if(!row)throw new Error("لم يتم العثور على القسم في قاعدة البيانات");
     const {error:insertError}=await sb.from("categories").insert({name,sort_order:1000000+(Date.now()%100000)}); if(insertError)throw insertError; inserted=true;
     const {error:updateError}=await sb.from("news").update({category:name}).eq("category",old); if(updateError)throw updateError; moved=true;
     const {error:deleteError}=await sb.from("categories").delete().eq("id",row.id); if(deleteError)throw deleteError;
     const {error:orderError}=await sb.from("categories").update({sort_order:row.sort_order}).eq("name",name); if(orderError)throw orderError;
   }
   DB.cats[i]=name; affected.forEach(n=>n.cat=name); save();
   if(cloudReady){const fresh=await sb.from("categories").select("name").order("sort_order",{ascending:true});if(fresh.error)throw fresh.error;DB.cats=(fresh.data||[]).map(x=>x.name);}
   toast("تم تغيير اسم القسم وتحديث الأخبار المرتبطة به");render();
 }catch(e){if(moved){try{await sb.from("news").update({category:old}).eq("category",name);}catch(_){}}if(inserted){try{await sb.from("categories").delete().eq("name",name);}catch(_){}}toast("تعذر تعديل القسم: "+(e.message||"تحقق من صلاحيات قاعدة البيانات"));}
}
async function mvCat(i,d){const j=i+d;if(j<0||j>=DB.cats.length)return;[DB.cats[i],DB.cats[j]]=[DB.cats[j],DB.cats[i]];try{await cloudSaveCategories();save();render()}catch(e){toast("تعذر ترتيب الأقسام: "+e.message)}}
async function saveSet(){const s=DB.settings;s.name=$("#s1").value;s.primary=$("#brandPrimary").value;s.secondary=$("#brandSecondary").value;s.accent=$("#brandAccent").value;s.fb=$("#s2").value;s.x=$("#s3").value;s.social=s.social||{};s.social.fb=$("#s2").value;s.social.x=$("#s3").value;s.social.tiktok=$("#stiktok").value;s.social.instagram=$("#sinstagram").value;s.social.telegram=$("#stelegram").value;s.social.whatsapp=$("#swhatsapp").value;s.about=$("#s4").value;s.contact=$("#s5").value;s.privacy=$("#s6").value;s.terms=$("#s7").value;s.perPage=+$("#s8").value||12;s.adLink=$("#s9").value;try{await cloudSaveSettings();save();applyTheme();toast("تم حفظ الشعار والألوان والهوية وروابط التواصل للجميع");render()}catch(e){toast("تعذر حفظ الإعدادات: "+e.message)}}
async function chPw(){const p=$("#pw").value;if(p.length<8)return toast("8 أحرف على الأقل");const {error}=await sb.auth.updateUser({password:p});if(error)return toast("تعذر تغيير كلمة المرور: "+error.message);toast("تم تغيير كلمة المرور") }
function exportDB(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:"application/json"}));a.download="jnplus-backup.json";a.click()}
function importDB(i){const r=new FileReader();r.onload=()=>{try{DB=JSON.parse(r.result);save();toast("تمت الاستعادة");render()}catch(e){toast("ملف غير صالح")}};r.readAsText(i.files[0])}

/* ---------- Router ---------- */
function render(x){
const h=location.hash||"#/",a=h.split("/"),el=$("#app");
const keep=document.activeElement&&document.activeElement.id,sel=keep&&document.activeElement.selectionStart;
document.title=DB.settings.name;
if(h.startsWith("#/admin"))el.innerHTML=x||(isAdm()?admin():login());
else if(a[1]==="n")el.innerHTML=article(a[2]);
else if(a[1]==="c"){const c=decodeURIComponent(a[2]);el.innerHTML=list(esc(c),pub().filter(n=>n.cat===c))}
else if(a[1]==="s"){const q=decodeURIComponent(a[2]||"");el.innerHTML=list("نتائج البحث: "+esc(q),pub().filter(n=>[n.title,n.summary,n.body,n.keys,n.cat].join(" ").includes(q)))}
else if(a[1]==="top")el.innerHTML=list("الأكثر قراءة",[...pub()].sort((a,b)=>b.views-a.views).slice(0,30));
else if(a[1]==="p")el.innerHTML=page(a[2]);
else el.innerHTML=home();
if(keep&&$("#"+keep)){$("#"+keep).focus();try{$("#"+keep).setSelectionRange(sel,sel)}catch(e){}}
}
addEventListener("hashchange",()=>{window.scrollTo(0,0);render()});
(async()=>{try{await cloudLoad();}catch(e){console.error(e);toast("تعذر الاتصال بقاعدة البيانات. تحقق من إعدادات Supabase");}applyTheme();render();})();
sb.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;if(!cloudUser)cloudRole=null;});
</script>
